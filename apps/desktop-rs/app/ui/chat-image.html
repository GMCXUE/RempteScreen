<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片</title><link rel="stylesheet" href="chat-image.css"><link rel="stylesheet" href="motion.css"></head><body>
<header class="image-toolbar" aria-label="图片工具栏">
<div class="image-tools"><button id="image-fit" title="适应窗口" aria-label="适应窗口"></button><span class="image-divider"></span><button id="image-out" title="缩小" aria-label="缩小"></button><output id="image-scale" aria-label="缩放比例">—</output><button id="image-in" title="放大" aria-label="放大"></button><button id="image-original" title="原始大小" aria-label="原始大小">1:1</button><span class="image-divider"></span><button id="image-rotate" title="旋转" aria-label="旋转"></button><button id="image-copy" title="复制图片" aria-label="复制图片"></button></div>
<button id="image-close" title="关闭" aria-label="关闭"></button></header>
<main id="image-stage" tabindex="0" aria-label="图片画布，滚轮缩放，拖动查看，双击切换原始大小"><img id="image-photo" alt="聊天图片" draggable="false" hidden><div id="image-state" role="status"><span id="image-status">正在加载图片…</span><button id="image-retry" hidden>重试</button></div></main>
<div id="image-toast" role="status" hidden></div><script src="motion.js"></script><script src="ui-icons.js"></script><script src="chat-image.js"></script></body></html>
