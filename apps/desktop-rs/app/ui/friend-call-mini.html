<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频通话</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#152238;color:#fff;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
[hidden]{display:none!important}#mini{position:relative;width:100%;height:100%;cursor:pointer;user-select:none;overflow:hidden;border-radius:16px}#video{width:100%;height:100%;object-fit:cover;pointer-events:none}
#placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}.avatar{width:64px;height:64px;border-radius:18px;overflow:hidden}.avatar-art{width:100%;height:100%}#caption{position:absolute;bottom:0;left:0;right:0;padding:20px 10px 10px;background:linear-gradient(transparent,#0009);display:flex;justify-content:space-between;gap:8px;pointer-events:none}#name{white-space:nowrap;text-overflow:ellipsis;overflow:hidden}#clock{flex-shrink:0;color:#e2e8f0;font-size:11px}
#handle{position:absolute;inset:0;display:grid;place-items:center;font-size:30px}.docked#mini{border-radius:12px}.docked #video,.docked #placeholder,.docked #caption{display:none}#mini:focus-visible{outline:2px solid #8db7ff;outline-offset:-2px}
</style></head><body><main id="mini" tabindex="0" role="button" aria-label="视频通话，点击返回，拖到边缘收起"><img id="video" alt="对方视频" draggable="false" hidden><div id="placeholder"><div id="avatar" class="avatar"></div><span>视频通话</span></div><div id="caption"><span id="name"></span><span id="clock"></span></div><span id="handle" hidden>‹</span></main><script src="avatars.js"></script><script src="friend-call-mini.js"></script></body></html>
