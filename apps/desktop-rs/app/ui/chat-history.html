<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>聊天记录</title><link rel="stylesheet" href="chat-history.css"><link rel="stylesheet" href="motion.css"></head><body>
<header><h1 id="history-title">聊天记录</h1><form id="history-search"><input id="history-query" type="search" maxlength="200" placeholder="搜索聊天内容" aria-label="搜索聊天内容"><button type="submit">搜索</button></form><nav id="history-filters" aria-label="消息类型"></nav><div class="history-date"><label>日期 <input id="history-date" type="date" aria-label="按日期查找"></label><button id="history-reset" type="button">清除筛选</button></div></header>
<main id="history-results" aria-live="polite"></main><footer><span id="history-status" role="status"></span><button id="history-more" type="button" hidden>加载更多</button><button id="history-retry" type="button" hidden>重试</button></footer>
<script src="motion.js"></script><script src="chat-history.js"></script></body></html>
