<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>对方视频</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#e8edf5;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none}
.shell{position:relative;width:100%;height:100%;border:1px solid transparent;border-radius:16px;overflow:hidden;background:#182130}
.video-area{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
#video{transform:scaleX(-1);position:absolute;width:100%;height:100%;object-fit:cover;background:#080d13}#video[hidden]{display:none}
.placeholder{text-align:center;color:#8593a6;line-height:1.8;pointer-events:none}.placeholder svg{display:block;margin:0 auto 8px;color:#586b81}.placeholder strong{display:block;color:#becad9;font-weight:500}
.shell:hover{border-color:#ffffff35}.hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;opacity:0;pointer-events:none;text-shadow:0 1px 4px #000}.shell:hover .hint{opacity:1}.fold{width:32px;height:32px;display:grid;place-items:center;position:absolute;right:7px;top:7px;border:0;border-radius:50%;background:#15203099;color:white;opacity:0;cursor:pointer}.shell:hover .fold{opacity:1}.shell.folded{border-radius:50%}.folded .fold,.folded .hint,.folded .placeholder{display:none}
</style></head>
<body><div class="shell" id="shell">
<div class="video-area"><div class="placeholder"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="5" width="12" height="14" rx="3"/><path d="m15 9 6-3v12l-6-3"/></svg><strong>等待对方视频</strong>摄像头开启后自动显示</div><img id="video" alt="对方视频" draggable="false" hidden></div>
<span class="hint">拖动移动</span><button class="fold" id="fold" aria-label="收起视频" title="收起视频"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 12h12"/></svg></button>
</div><script src="call-video.js"></script></body></html>
