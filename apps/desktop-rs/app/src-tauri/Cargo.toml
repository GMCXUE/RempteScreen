[package]
name = "remotescreen-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
ureq = { version = "2", features = ["json"] }
livekit = { version = "0.9.4", features = ["native"] }
scap = "0.0.8"
tokio-stream = "0.1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
jpeg-encoder = "0.6"
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
mozjpeg = "0.10.13"
