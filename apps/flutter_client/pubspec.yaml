name: remotescreen
description: RemoteScreen —— 投送本机屏幕，或观看其他设备的屏幕
publish_to: none
version: 0.2.19+2026101308

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # LiveKit 官方 Flutter SDK，内部基于 flutter_webrtc，
  # 覆盖 Android / iOS / macOS / Windows / Web
  livekit_client: ^2.4.0
  # 渲染远端画面要用它的 RTCVideoRenderer / RTCVideoView
  flutter_webrtc: ^1.6.0
  cryptography: ^2.7.0
  crypto: ^3.0.7
  http: ^1.2.0
  shared_preferences: ^2.2.0
  image_picker: ^1.2.4
  shorebird_code_push: ^2.0.7
  video_player: ^2.14.1
  sqflite: ^2.4.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  video_player_platform_interface: ^6.9.0
  sqflite_common_ffi: 2.3.6
  sqlite3: ^2.9.0

# 本地补丁版：给 Android 投屏补上 mediaProjection 前台服务。
# Android 14+（实测 Android 17 对所有 targetSdk 生效）要求 getMediaProjection()
# 之前必须有该前台服务，官方版没有实现，直接投屏会抛 SecurityException 闪退。
dependency_overrides:
  flutter_webrtc:
    path: third_party/flutter_webrtc

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/update-public-key.json
    - shorebird.yaml
