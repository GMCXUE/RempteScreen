# LiveKit 自托管配置 —— 本地开发用
#
# 生产部署需要改动的地方已用 [PROD] 标出。

port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882
  # [PROD] 部署在公网服务器上时必须改为 true，
  # 否则服务端无法把自己真实的公网 IP 告诉客户端，ICE 会全部失败。
  use_external_ip: false

  # 本机开发时显式绑定回环地址，避免多网卡环境下选错网卡
  node_ip: 127.0.0.1

# 签发与校验客户端访问令牌的密钥对。
# [PROD] 必须替换成随机生成的长密钥，且不要提交进版本库。
# secret 长度不得短于 32 个字符。
keys:
  devkey: devsecret_devsecret_devsecret_32

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 8

logging:
  level: info
  json: false
