name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/windows-client']
    paths:
      - '.github/workflows/build-windows.yml'
      - 'tools/prepare-windows-webrtc.ps1'
      - 'tools/save-windows-build-log.ps1'
      - 'apps/desktop-rs/**'

permissions:
  # Diagnostics only: append to build-logs/windows, never overwrite source branches.
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: C:\rs-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-rs/app/src-tauri -> C:\rs-target
          cache-on-failure: true
      - name: Prepare short-path WebRTC SDK
        id: prepare
        shell: pwsh
        working-directory: apps/desktop-rs/app/src-tauri
        run: |
          & "${{ github.workspace }}/tools/prepare-windows-webrtc.ps1" 2>&1 | Tee-Object -FilePath "${{ github.workspace }}/prepare-log.txt"
      - name: Install Tauri CLI
        shell: pwsh
        run: |
          npm install --global @tauri-apps/cli@2.12.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        id: build
        shell: pwsh
        working-directory: apps/desktop-rs/app
        run: |
          # Invoke the native Node executable: the npm PowerShell shim consumes `--`.
          $cli = Join-Path (npm root --global) '@tauri-apps/cli/tauri.js'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node $cli build --target x86_64-pc-windows-msvc --bundles nsis -- --locked 2>&1 | Tee-Object -FilePath "${{ github.workspace }}/build-log.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer output
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) { throw 'No Windows installer was produced' }
          $installers | Get-FileHash -Algorithm SHA256 | Format-Table
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RemoteScreen-Windows-x64
          path: C:/rs-target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-log
          path: |
            build-log.txt
            prepare-log.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Save diagnostics branch
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        run: '& ./tools/save-windows-build-log.ps1'
