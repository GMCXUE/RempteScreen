name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows.yml"
      - "apps/desktop-rs/**"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-rs/app/src-tauri

      - name: 安装 Tauri CLI
        shell: pwsh
        run: npm i -g @tauri-apps/cli@latest

      - name: 构建
        shell: pwsh
        run: npx @tauri-apps/cli build
        working-directory: apps/desktop-rs/app

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (Test-Path "apps/desktop-rs/app/src-tauri/target/release/remotescreen-desktop.exe") {
            Copy-Item "apps/desktop-rs/app/src-tauri/target/release/remotescreen-desktop.exe" "dist/"
          }
          if (Test-Path "apps/desktop-rs/app/src-tauri/target/release/bundle/nsis/*.exe") {
            Copy-Item "apps/desktop-rs/app/src-tauri/target/release/bundle/nsis/*.exe" "dist/"
          }
          Get-ChildItem dist

      # 把产物提交回 dist 分支（无需 token，用内置 GITHUB_TOKEN）
      - name: 发布到 dist 分支
        shell: pwsh
        run: |
          git config user.name "windows-builder"
          git config user.email "builder@remotescreen.local"
          git fetch origin dist || echo "dist 分支不存在，将创建"
          git checkout dist 2>$null || git checkout -b dist origin/dist 2>$null || git checkout --orphan dist
          git checkout dist 2>$null
          Copy-Item dist\* . -Force
          git add remotescreen-desktop.exe *.exe 2>$null
          git add -A dist 2>$null
          git commit -m "Windows build $env:GITHUB_SHA" 2>$null
          git push origin dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
