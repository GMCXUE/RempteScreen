name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows.yml"
      - "apps/desktop-rs/**"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-rs/app/src-tauri

      - name: 安装 Tauri CLI
        shell: pwsh
        run: npm i -g @tauri-apps/cli@latest

      - name: 构建（日志落盘）
        shell: pwsh
        run: npx @tauri-apps/cli build 2>&1 | Tee-Object -FilePath build-log.txt
        working-directory: apps/desktop-rs/app

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (Test-Path "apps/desktop-rs/app/src-tauri/target/release/remotescreen-desktop.exe") {
            Copy-Item "apps/desktop-rs/app/src-tauri/target/release/remotescreen-desktop.exe" "dist/"
          }
          if (Test-Path "apps/desktop-rs/app/src-tauri/target/release/bundle/nsis/*.exe") {
            Copy-Item "apps/desktop-rs/app/src-tauri/target/release/bundle/nsis/*.exe" "dist/"
          }
          Copy-Item build-log.txt dist/ -ErrorAction SilentlyContinue
          Get-ChildItem dist

      # 无论成败，把产物/日志提交回 dist 分支（远程可诊断）
      - name: 回传到 dist 分支
        if: always()
        shell: pwsh
        run: |
          git config user.name "windows-builder"
          git config user.email "builder@remotescreen.local"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (Test-Path "apps/desktop-rs/app/src-tauri/target/release/remotescreen-desktop.exe") {
            Copy-Item "apps/desktop-rs/app/src-tauri/target/release/remotescreen-desktop.exe" "dist/"
          }
          if (Test-Path "apps/desktop-rs/app/src-tauri/target/release/bundle/nsis/RemoteScreen_0.1.0_x64-setup.exe") {
            Copy-Item "apps/desktop-rs/app/src-tauri/target/release/bundle/nsis/RemoteScreen_0.1.0_x64-setup.exe" "dist/"
          }
          if (Test-Path "build-log.txt") { Copy-Item build-log.txt dist/ }
          git add dist 2>$null
          git commit -m "windows build ($env:GITHUB_RUN_ID) $env:CI_JOB_STATUS" 2>$null
          git push origin HEAD:dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
